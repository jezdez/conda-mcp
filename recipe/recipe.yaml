schema_version: 1

context:
  version: ${{ env.get("CONDA_MCP_VERSION") }}
  source_sha256: ${{ env.get("CONDA_MCP_SOURCE_SHA256", default="") }}

package:
  name: conda-mcp
  version: ${{ version }}

source:
  - if: source_sha256 != ""
    then:
      url: https://files.pythonhosted.org/packages/source/c/conda_mcp/conda_mcp-${{ version }}.tar.gz
      sha256: ${{ source_sha256 }}
    else:
      path: ..

build:
  noarch: python
  script:
    - if: source_sha256 == ""
      then:
        - if: win
          then: set "SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}"
          else: export SETUPTOOLS_SCM_PRETEND_VERSION="${{ version }}"
    - python -m pip install . --no-deps --no-build-isolation
    - python -c "import os, shutil; target = os.path.join(os.environ['PREFIX'], 'share', 'conda-mcp', 'servers'); os.makedirs(target, exist_ok=True); shutil.copy2(os.path.join('recipe', 'conda-cli.json'), target)"

requirements:
  host:
    - python 3.11.*
    - pip
    - hatchling >=1.27
    - hatch-vcs >=0.4
  run:
    - python >=3.11
    - conda >=26.10
    - anyio >=4.9
    - jsonschema >=4.20
    - mcp >=2,<3
    - pywin32-on-windows >=0.1.0
    - rich >=13
    - tomlkit >=0.13
  run_constraints:
    - conda-cli-mcp <0a0
    - pywin32 >=311

tests:
  - python:
      imports:
        - conda_mcp.plugin
      pip_check: true
  - script: python scripts/smoke_plugin.py
    files:
      source:
        - scripts/smoke_plugin.py

about:
  summary: Discover, run, and configure conda-packaged MCP servers
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
