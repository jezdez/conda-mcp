name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows and report to code scanning
        id: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          inputs: .github/workflows
          min-severity: medium
          advanced-security: true
          online-audits: true
      - name: Fail on medium-or-higher findings
        env:
          SARIF_FILE: ${{ steps.zizmor.outputs.output-file }}
        run: |
          jq -e '(.runs | length) > 0 and all(.runs[]; (.results // [] | length) == 0)' "$SARIF_FILE"

  tests:
    name: ${{ matrix.os }} / ${{ matrix.environment }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [py311, py314]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          activate-environment: ''
          auto-activate: true
      - run: conda install -n base --yes --override-channels -c conda-forge 'conda>=26.10' 'conda-workspaces>=0.12'
      - run: conda workspace install --locked -e ${{ matrix.environment }}
      - run: conda task run -e ${{ matrix.environment }} check-code
      - id: tests
        run: conda task run -e ${{ matrix.environment }} test-ci
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.environment }}
          CONDA_MCP_EXECV_PATCH: ${{ runner.os == 'Windows' && 'subprocess' || 'execv' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.environment }}
          path: .coverage.*
          if-no-files-found: error
          include-hidden-files: true

  coverage:
    name: Combined coverage
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          activate-environment: ''
          auto-activate: true
      - run: conda install -n base --yes --override-channels -c conda-forge 'conda>=26.10' 'conda-workspaces>=0.12'
      - run: conda workspace install --locked -e default
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Combine branch and subprocess coverage
        run: conda task run -e default coverage-report

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          activate-environment: ''
          auto-activate: true
      - run: conda install -n base --yes --override-channels -c conda-forge 'conda>=26.10' 'conda-workspaces>=0.12'
      - run: conda workspace install --locked -e build
      - run: conda workspace install --locked -e docs
      - run: conda task run build
      - run: conda task run check-dist
      - run: conda task run test-wheel
      - run: conda task run test-examples
      - run: conda task run build-conda
      - run: conda task run check-workflows
      - run: conda task run docs

  windows-examples:
    name: Windows example checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          activate-environment: ''
          auto-activate: true
      - run: conda install -n base --yes --override-channels -c conda-forge 'conda>=26.10' 'conda-workspaces>=0.12'
      - run: conda workspace install --locked -e build
      - run: conda task run test-examples
