[workspace]
name = "conda-mcp"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.15"
conda = ">=26.10"
anyio = ">=4.9"
jsonschema = ">=4.20"
mcp = ">=2,<3"
rich = ">=13"
tomlkit = ">=0.13"

[tasks]
install = "python -m pip install --no-deps --no-build-isolation -e ."
test = { cmd = "pytest", depends-on = ["install"] }
lint = "ruff check src tests scripts examples docs/conf.py"
format = "ruff format src tests scripts examples docs/conf.py"
format-check = "ruff format --check src tests scripts examples docs/conf.py"
type-check = "ty check src"
check = { depends-on = ["test", "lint", "format-check", "type-check"] }
check-code = { depends-on = ["install", "lint", "format-check", "type-check"] }
test-ci = { cmd = "pytest --cov-fail-under=0 --cov-report=", depends-on = ["install"] }
coverage-report = { cmd = "coverage combine coverage && coverage report --fail-under=95 && coverage xml", depends-on = ["install"] }
build = { cmd = "python -m build --no-isolation", default-environment = "build" }
check-dist = { cmd = "python scripts/check_dist.py", default-environment = "build" }
test-wheel = { cmd = "python scripts/test_wheel.py", default-environment = "build" }
test-examples = { cmd = "python scripts/test_examples.py", depends-on = ["install"], default-environment = "build" }
build-conda = { cmd = 'version=$(python -m hatchling version) && CONDA_MCP_VERSION="$version" rattler-build build -r recipe/recipe.yaml --output-dir conda-dist -c conda-forge', default-environment = "build" }
docs = { cmd = "sphinx-build -W --keep-going -n -b dirhtml docs docs/_build/dirhtml", default-environment = "docs" }
check-workflows = { cmd = "actionlint", default-environment = "build" }

[target.win-64.tasks]
build-conda = { cmd = ["powershell", "-NoProfile", "-Command", '$version = python -m hatchling version; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $env:CONDA_MCP_VERSION = $version; rattler-build build -r recipe/recipe.yaml --output-dir conda-dist -c conda-forge; exit $LASTEXITCODE'], default-environment = "build" }

[target.win-64.dependencies]
pywin32 = ">=311"

[feature.dev.dependencies]
conda-workspaces = ">=0.12"
ruff = ">=0.14"
ty = ">=0.0.1"

[feature.test.dependencies]
pytest = ">=8"
pytest-cov = ">=7"
coverage = ">=7.10.6"
pip = "*"
hatchling = ">=1.27"
hatch-vcs = ">=0.4"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.docs.dependencies]
sphinx = ">=8"
myst-parser = ">=4"
conda-sphinx-theme = ">=0.3"
sphinx-design = ">=0.8"

[feature.build.dependencies]
conda-build = ">=26.9"
py-rattler-build = "*"
rattler-build = ">=0.80"
pip = "*"
hatchling = ">=1.27"
hatch-vcs = ">=0.4"
python-build = ">=1"
twine = ">=6.2"
actionlint = ">=1.7"

[environments]
default = ["dev", "test"]
py311 = ["dev", "test", "py311"]
py314 = ["dev", "test", "py314"]
docs = ["docs"]
build = ["build"]
